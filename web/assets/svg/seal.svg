<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#fbe7ab"/>
      <stop offset=".32" stop-color="#e3b862"/>
      <stop offset=".68" stop-color="#b8862f"/>
      <stop offset="1" stop-color="#76501a"/>
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="35%" r="72%">
      <stop offset="0" stop-color="#f7dc95"/>
      <stop offset=".6" stop-color="#d0a048"/>
      <stop offset="1" stop-color="#9b6d25"/>
    </radialGradient>
    <filter id="edge" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- irregular poured-wax rim -->
  <circle cx="60" cy="60" r="49" fill="url(#wax)" filter="url(#edge)"/>
  <!-- pressed stamp face -->
  <circle cx="60" cy="60" r="36" fill="url(#face)"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="#83591c" stroke-opacity=".6" stroke-width="2.2"/>
  <circle cx="60" cy="60" r="33.2" fill="none" stroke="#fff1c8" stroke-opacity=".55" stroke-width="1"/>
  <!-- glossy highlight -->
  <ellipse cx="45" cy="39" rx="15" ry="6.5" fill="#fff7dc" opacity=".38" transform="rotate(-32 45 39)"/>
</svg>
