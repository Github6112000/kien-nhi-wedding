<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelope Opening K&amp;N</title>
<style>
  :root { --bg:#2a0a12; --r:0.46127; } /* r = 1179/2556 (tỉ lệ ảnh gốc) */
  html,body { margin:0; height:100%; background:var(--bg); }
  body { overflow:hidden; position:fixed; inset:0; touch-action:manipulation; }
  /* COVER: luôn phủ kín màn hình mọi tỉ lệ máy (9:16 → 9:21, tablet). Phần dư xén đều 2 mép, sáp luôn ở giữa */
  .stage { position:absolute; left:50%; top:50%;
           width:max(100vw, calc(100vh * var(--r))); height:max(100vh, calc(100vw / var(--r)));
           width:max(100vw, calc(100dvh * var(--r))); height:max(100dvh, calc(100vw / var(--r)));
           transform:translate(-50%,-50%); perspective-origin:50% 45%; }
  .env { position:absolute; inset:0; transform-style:preserve-3d; cursor:pointer; }
  .layer { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face img { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain;
               user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .face.back { transform:rotateX(180deg); }
  /* Mặt trong giấy (TẠM, lớp mới — không phải ảnh gốc) */
  .inside { position:absolute; inset:0; background:linear-gradient(#4a0811,#62101c 60%,#520b15); }
  /* Lớp đổ sáng/tối khi giấy nghiêng (overlay riêng, opacity=0 lúc đứng yên) */
  .shade { position:absolute; inset:0; opacity:0; pointer-events:none; }

  .card  { transform-origin:50% 45%; } /* translateZ + scale bù phối cảnh: đặt bằng JS theo kích thước máy */
  .ph-card { position:absolute; inset:0; background:#f4ecdf; display:grid; place-items:center;
              font:italic 600 clamp(14px,4vw,28px)/1 Georgia,serif; color:#8a6a3a; letter-spacing:.08em; }
  .cardshadow { position:absolute; inset:0; opacity:0; pointer-events:none; }
  .body  { transform-origin:50% 100%; }
  .flap  { transform-origin:50% 0%; }
  .sealshadow { position:absolute; inset:0; opacity:0; pointer-events:none;
                 background:radial-gradient(ellipse 30% 10% at 50% var(--sy,56%), rgba(20,0,4,.6), rgba(20,0,4,0) 70%); }
</style>
</head>
<body>
<div class="stage">
 <div class="env" id="env" aria-label="Mở thiệp">
  <!-- Thiệp: TẠM placeholder → thay bằng <img src="invitation.png"> -->
  <div class="layer card" id="card">
    <div class="ph-card"><span>Thiệp của bạn</span></div>
    <div class="cardshadow" id="cardTop"   style="background:linear-gradient(to bottom, rgba(25,0,5,.55), rgba(25,0,5,0) 30%)"></div>
    <div class="cardshadow" id="cardBot"   style="background:linear-gradient(to top, rgba(25,0,5,.55), rgba(25,0,5,0) 35%)"></div>
    <div class="sealshadow" id="sealShadow"></div>
  </div>

  <!-- Cánh dưới (thân phong bì) — ảnh gốc, chỉ cắt bằng clip-path -->
  <div class="layer body" id="body">
    <div class="face front" style="clip-path:polygon(0.00% 39.12%, 34.34% 50.80%, 34.79% 52.05%, 35.55% 53.25%, 36.58% 54.38%, 37.87% 55.42%, 39.40% 56.33%, 41.14% 57.12%, 43.04% 57.76%, 45.08% 58.24%, 47.22% 58.55%, 49.41% 58.68%, 51.61% 58.64%, 53.77% 58.41%, 55.87% 58.02%, 57.85% 57.46%, 59.67% 56.74%, 61.31% 55.89%, 62.72% 54.91%, 63.89% 53.83%, 64.78% 52.66%, 65.39% 51.43%, 65.70% 50.17%, 100.00% 38.15%, 100.00% 100.00%, 0.00% 100.00%)">
      <img src="envelope.png" alt="">
      <div class="shade" id="bodyShade" style="background:linear-gradient(to top, rgba(0,0,0,0) 40%, rgba(15,0,3,.85))"></div>
    </div>
    <div class="face back" style="clip-path:polygon(0.00% 60.88%, 34.34% 49.20%, 34.79% 47.95%, 35.55% 46.75%, 36.58% 45.62%, 37.87% 44.58%, 39.40% 43.67%, 41.14% 42.88%, 43.04% 42.24%, 45.08% 41.76%, 47.22% 41.45%, 49.41% 41.32%, 51.61% 41.36%, 53.77% 41.59%, 55.87% 41.98%, 57.85% 42.54%, 59.67% 43.26%, 61.31% 44.11%, 62.72% 45.09%, 63.89% 46.17%, 64.78% 47.34%, 65.39% 48.57%, 65.70% 49.83%, 100.00% 61.85%, 100.00% 0.00%, 0.00% 0.00%)">
      <div class="inside"></div>
      <div class="shade" id="bodyBackShade" style="opacity:.5;background:linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(15,0,3,.8))"></div>
    </div>
  </div>

  <!-- Nắp trên + ren + con sáp — ảnh gốc, chỉ cắt bằng clip-path -->
  <div class="layer flap" id="flap">
    <div class="face front" style="clip-path:polygon(0.00% 0.00%, 100.00% 0.00%, 100.00% 38.15%, 65.70% 50.17%, 65.39% 51.43%, 64.78% 52.66%, 63.89% 53.83%, 62.72% 54.91%, 61.31% 55.89%, 59.67% 56.74%, 57.85% 57.46%, 55.87% 58.02%, 53.77% 58.41%, 51.61% 58.64%, 49.41% 58.68%, 47.22% 58.55%, 45.08% 58.24%, 43.04% 57.76%, 41.14% 57.12%, 39.40% 56.33%, 37.87% 55.42%, 36.58% 54.38%, 35.55% 53.25%, 34.79% 52.05%, 34.34% 50.80%, 0.00% 39.12%)">
      <img src="envelope.png" alt="">
      <div class="shade" id="flapShade" style="background:linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(15,0,3,.85))"></div>
    </div>
    <div class="face back" style="clip-path:polygon(0.00% 100.00%, 100.00% 100.00%, 100.00% 61.85%, 65.70% 49.83%, 65.39% 48.57%, 64.78% 47.34%, 63.89% 46.17%, 62.72% 45.09%, 61.31% 44.11%, 59.67% 43.26%, 57.85% 42.54%, 55.87% 41.98%, 53.77% 41.59%, 51.61% 41.36%, 49.41% 41.32%, 47.22% 41.45%, 45.08% 41.76%, 43.04% 42.24%, 41.14% 42.88%, 39.40% 43.67%, 37.87% 44.58%, 36.58% 45.62%, 35.55% 46.75%, 34.79% 47.95%, 34.34% 49.20%, 0.00% 60.88%)">
      <div class="inside"></div>
      <div class="shade" id="flapBackShade" style="opacity:.5;background:linear-gradient(to top, rgba(0,0,0,0) 40%, rgba(15,0,3,.8))"></div>
    </div>
  </div>
 </div>
</div>
<script>
/* ---------- easing ---------- */
function bezier(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<8;i++){const e=sx(t)-x,d=dx(t);if(Math.abs(e)<1e-6||!d)break;t-=e/d;}return sy(Math.min(1,Math.max(0,t)));};}
const E = {
  lin:  x=>x,
  out:  bezier(0.2,0.6,0.35,1),     // nhấc nhẹ
  inout:bezier(0.45,0,0.55,1),      // khựng/thả
  pull: bezier(0.5,0,0.3,1),        // tay kéo: chậm lúc đầu (giấy cứng), nhanh dần, chậm khi gần nằm
  settle:bezier(0.3,0,0.4,1),
  smooth:bezier(0.42,0,0.75,0.55),  // 1 đường cong liền mạch 0→180°: khởi động êm, ~2/3 thời gian cho đoạn nhìn thấy
  pullA:bezier(0.5,0,0.75,0.7),     // đoạn nhìn thấy: khởi động chậm (giấy cứng), giữ đà
  pullB:bezier(0.3,0.07,0.6,1),     // đoạn đã ra khỏi khung: nối liền tốc độ, chậm dần khi nằm xuống
};
/* track: [[t, value, ease], ...] — ease áp cho đoạn ĐẾN keyframe đó */
function track(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i=1;i<keys.length;i++){ const [t1,v1,e]=keys[i], [t0,v0]=keys[i-1];
    if (t <= t1) return v0 + (v1-v0)*E[e||'inout']((t-t0)/(t1-t0)); }
  return keys[keys.length-1][1];
}
const clamp01=v=>Math.min(1,Math.max(0,v));

/* ---------- TIMELINE (ms) ---------- */
const K = {
  // Mỗi cánh = MỘT chuyển động liền mạch, không khựng, không nảy → mượt
  flap: [[0,0],[600,0],[4000,180,'smooth']],
  // Cánh dưới khởi động khi nắp trên đang mở được ~1/2 → hai cánh cùng mở, một động tác liền mạch
  body: [[0,0],[1400,0],[4300,-180,'smooth']],
};
const TOTAL = 5400;
window.TIMELINE = { total: TOTAL };

const $ = id => document.getElementById(id);
const env=$('env'), flap=$('flap'), body=$('body');
/* Phối cảnh tỉ lệ theo kích thước khung → chuyển động giống nhau trên mọi máy */
function fit(){
  const h = env.getBoundingClientRect().height || innerHeight;
  const P = h * 2.0, D = h * 0.03;           // perspective = 2× chiều cao; thiệp lùi 3% để xếp lớp đúng
  document.querySelector('.stage').style.perspective = P + 'px';
  $('card').style.transform = `translateZ(${-D}px) scale(${(P + D) / P})`;  // bù phối cảnh → thiệp hiển thị đúng 100%
}
fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit);

function renderAt(t){
  // Máy quay tiến rất chậm, đều (không rung) — tạo chiều sâu nhẹ
  const drift = E.inout(clamp01(t / TOTAL));
  env.style.transform = `scale(${(1 + drift*0.02).toFixed(4)})`;

  // ----- NẮP -----
  const f = track(K.flap, t);
  const fp = clamp01((t-600)/(4000-600));                   // tiến trình đoạn kéo
  const wob = Math.sin(fp*Math.PI);                           // lệch trục do tay, mạnh nhất giữa hành trình
  flap.style.transform = `translateZ(${f>90?-1:3}px) rotateX(${f}deg) rotateZ(${(wob*0.5).toFixed(3)}deg)`;
  const fs = Math.sin(Math.min(Math.abs(f),180)*Math.PI/180);
  $('flapShade').style.opacity = (f<90 ? 0.55*fs : 0).toFixed(3);
  $('flapBackShade').style.opacity = (f>90 ? 0.5*fs : 0).toFixed(3);
  // bóng con sáp/nắp đổ lên thiệp khi nắp còn thấp
  const low = f<90 ? Math.sin(f*Math.PI/180) * (1 - clamp01((f-45)/45)) : 0;
  $('sealShadow').style.opacity = (0.55*low).toFixed(3);
  $('sealShadow').style.setProperty('--sy', (52 + 5*low) + '%');
  $('cardTop').style.opacity = (0.35*fs).toFixed(3);

  // ----- CÁNH DƯỚI -----
  const b = track(K.body, t);
  const bp = clamp01((t-1400)/(4300-1400));
  const bw = Math.sin(bp*Math.PI);
  body.style.transform = `translateZ(${b<-90?-2:1}px) rotateX(${b}deg) rotateZ(${(bw*-0.4).toFixed(3)}deg)`;
  const bs = Math.sin(Math.min(Math.abs(b),180)*Math.PI/180);
  $('bodyShade').style.opacity = (Math.abs(b)<90 ? 0.6*bs : 0).toFixed(3);
  $('bodyBackShade').style.opacity = (Math.abs(b)>90 ? 0.5*bs : 0).toFixed(3);
  $('cardBot').style.opacity = (0.35*bs).toFixed(3);
}
window.renderAt = renderAt;

let start=null, playing=false;
function tick(now){ if(start===null) start=now; const t=now-start; renderAt(t); if(t<TOTAL) requestAnimationFrame(tick); else playing=false; }
function play(){ if(playing) return; playing=true; start=null; requestAnimationFrame(tick); }
window.play=play;
renderAt(0);
const q=new URLSearchParams(location.search);
if(q.has('t')) renderAt(+q.get('t')); else if(q.get('autoplay')==='1') setTimeout(play,300);
env.addEventListener('click', play);
</script>
</body>
</html>
